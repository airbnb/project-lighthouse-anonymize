name: Publish to PyPI

# Actions are pinned to full SHAs to prevent supply chain attacks (tag hijacking).
# Dependabot is configured to automate SHA updates (see .github/dependabot.yml).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/project-lighthouse-anonymize
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0  # For hatch-vcs

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install build hatch hatch-vcs

    - name: Build package
      run: python -m build

    - name: Verify package installation
      run: |
        pip install dist/*.whl
        pip check

    - name: Attest build provenance
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
      with:
        subject-path: dist/*.whl

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
      with:
        print-hash: true
