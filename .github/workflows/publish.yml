name: Publish to PyPI

# Actions are pinned to full SHAs to prevent supply chain attacks (tag hijacking).
# Dependabot is configured to automate SHA updates (see .github/dependabot.yml).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/project-lighthouse-anonymize
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # For hatch-vcs

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install build hatch hatch-vcs

    - name: Build package
      run: python -m build

    - name: Verify package installation
      run: |
        pip install dist/*.whl
        pip check

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-path: dist/*.whl

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        print-hash: true
